<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Gerado por scripts/prerender.mjs para cada idioma; aqui fica só o padrão do modo dev -->
    <!--seo-->
    <title>Bryan Maciel | Criação de Sites Profissionais e Landing Pages</title>
    <meta name="description" content="Desenvolvedor web freelancer: criação de sites profissionais, landing pages e aplicações web." />
    <link rel="canonical" href="https://www.bryanmaciel.dev/" />
    <meta property="og:url" content="https://www.bryanmaciel.dev/" />
    <!--/seo-->
    <meta name="theme-color" content="#09090a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Antes da página aparecer: idioma lembrado (ou ?lang= antigo) e tema salvo -->
    <script>
      try {
        var rotas = { pt: "/", en: "/en/", es: "/es/" };
        var daUrl = new URLSearchParams(location.search).get("lang");
        var alvo = rotas[daUrl];
        if (!alvo && location.pathname === "/") {
          var salvo = localStorage.getItem("portfolio-idioma");
          if (salvo !== "pt") alvo = rotas[salvo];
        }
        if (alvo && alvo !== location.pathname) location.replace(alvo + location.hash);
      } catch (e) {}
      try {
        var tema = localStorage.getItem("portfolio-tema");
        if (tema === "light" || tema === "dark") {
          document.documentElement.dataset.theme = tema;
          if (tema === "light")
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#e9e9ec");
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      rel="preload"
      as="image"
      href="/projetos/pisos.webp"
      type="image/webp"
      fetchpriority="high"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
